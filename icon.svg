<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect x="2" y="20" width="60" height="12" fill="#ffffff" stroke="#1f2937" stroke-width="2.5"/>
  <!-- Left subdivisions before 0 -->
  <rect x="2" y="20" width="5" height="6" fill="#1f2937"/>
  <rect x="7" y="26" width="5" height="6" fill="#1f2937"/>
  <rect x="12" y="20" width="5" height="6" fill="#1f2937"/>
  <rect x="17" y="26" width="5" height="6" fill="#1f2937"/>
  <line x1="22" y1="16" x2="22" y2="36" stroke="#dc2626" stroke-width="2.5"/>
  <!-- Custom irregular right divisions -->
  <rect x="22" y="20" width="8" height="6" fill="#1f2937"/>
  <rect x="30" y="26" width="12" height="6" fill="#1f2937"/>
  <rect x="42" y="20" width="20" height="6" fill="#1f2937"/>
  <line x1="2" y1="26" x2="62" y2="26" stroke="#1f2937" stroke-width="1.5"/>
  <!-- Labels -->
  <text x="22" y="47" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#dc2626">0</text>
  <text x="4" y="47" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#1f2937">100</text>
  <text x="30" y="47" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#1f2937">50</text>
  <text x="42" y="47" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#1f2937">150</text>
  <text x="60" y="47" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#1f2937">500</text>
</svg>
